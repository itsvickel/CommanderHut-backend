services:
  - type: web
    name: commanderhut-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # set in dashboard: Atlas mongodb+srv:// URI
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # set in dashboard: https://<your-app>.vercel.app
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # set in dashboard
      - key: GEMINI_API_KEY
        sync: false # set in dashboard
